name: CampusBridge AI — Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-ci:
    name: Full-Stack Verification (Postgres, Qdrant, Pytest 63/63 & Next.js Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campusbridge
          POSTGRES_USER: campusbridge
          POSTGRES_PASSWORD: campusbridge_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334

    env:
      DATABASE_URL: postgresql+asyncpg://campusbridge:campusbridge_dev@localhost:5432/campusbridge
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      LIVEKIT_URL: https://campusbridge-mock.livekit.cloud
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecretsecret32
      NEXTAUTH_SECRET: supersecretdevkeyfornextauth32charsmin!
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      PYTHONPATH: .

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────────
      # Backend Step 1: Set up Python 3.11 Runtime
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (libpq)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      # ─────────────────────────────────────────────────────────────────────────────
      # Backend Step 2: Execute Pytest Suite (All 63 Tests)
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Run Backend Pytest Suite (63/63 Unit, RAG, Tool-Calling & Sandbox Tests)
        run: |
          python -m pytest tests/ -v

      # ─────────────────────────────────────────────────────────────────────────────
      # Frontend Step 3: Set up Node.js Runtime
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # ─────────────────────────────────────────────────────────────────────────────
      # Frontend Step 4: Install Dependencies & Verify Next.js Production Build
      # ─────────────────────────────────────────────────────────────────────────────
      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci || npm install

      - name: Compile Next.js 14 Web App (Typecheck & Middleware Verification)
        working-directory: apps/web
        run: |
          npm run build

