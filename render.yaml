services:
  - type: web
    name: campusbridge-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 1
      - key: MALLOC_ARENA_MAX
        value: 2
      - key: DATABASE_URL
        sync: false
        # e.g. postgresql+asyncpg://neondb_owner:password@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: QDRANT_URL
        sync: false
        # e.g. https://your-cluster-id.us-east4-0.gcp.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false
      - key: LIVEKIT_URL
        value: wss://first-w4gv5xp4.livekit.cloud
      - key: LIVEKIT_API_KEY
        value: APINi6TrE9hzACu
      - key: LIVEKIT_API_SECRET
        value: Qhdedtc0cFM0jJ9nBF7n6J3bqzz1ifR4kTY6Ro32zI7
      - key: LIVEKIT_AGENT_NAME
